[project]
name = "newsfeed-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "sqlalchemy[asyncio]==2.1.3",
    "asyncpg==0.31.0",
    "redis==8.1.0",
    "aio-pika==10.1.0",
    "pyjwt==2.15.1",
    "pydantic-settings==2.15.0",
    "alembic==1.20.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis==2.39.0",
    "httpx==0.28.1",
    "hypothesis==6.168.3",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
