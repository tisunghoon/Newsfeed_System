services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: newsfeed
      POSTGRES_PASSWORD: newsfeed
      POSTGRES_DB: newsfeed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: newsfeed
      RABBITMQ_DEFAULT_PASS: newsfeed
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
